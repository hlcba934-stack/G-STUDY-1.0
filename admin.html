<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>G-STUDY • Internal portal</title>
  <style>
    :root{color-scheme:light;--ink:#25332c;--muted:#7c8a82;--line:#e4ebe5;--green:#31845c;--green-dark:#256847;--paper:#fff}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#fbfcfb;color:var(--ink)}
    body{min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,390px);display:grid;gap:28px}
    .brand{font-family:Georgia,serif;font-size:15px;color:#87948c;letter-spacing:.1px}
    form{display:grid;gap:12px}
    input{width:100%;height:54px;padding:0 17px;border:1px solid #dce5de;border-radius:12px;background:#fff;color:#20332a;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
    input:focus{border-color:var(--green);box-shadow:0 0 0 3px #31845c20}
    button{height:52px;border:0;border-radius:12px;background:var(--green);color:white;font-size:15px;font-weight:700;cursor:pointer;transition:background .15s,transform .15s}
    button:hover{background:var(--green-dark)}
    button:active{transform:translateY(1px)}
    button:disabled{opacity:.65;cursor:wait}
    .message{min-height:18px;margin:0;color:#9b4242;font-size:13px;text-align:center}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main>
    <div class="brand">G-STUDY • Internal portal</div>
    <form id="gate" autocomplete="on">
      <input id="secret" name="password" type="password" placeholder="Mật khẩu" autocomplete="current-password" required autofocus aria-label="Mật khẩu">
      <button id="submit" type="submit">Truy cập</button>
      <p class="message" id="message" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script>
    const form = document.getElementById('gate');
    const password = document.getElementById('secret');
    const button = document.getElementById('submit');
    const message = document.getElementById('message');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!password.value) return;
      button.disabled = true;
      message.textContent = '';
      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({password: password.value})
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || !result.ok) throw new Error('Không thể xác thực.');
        window.location.replace('/admin/dashboard');
      } catch (_) {
        password.value = '';
        message.textContent = 'Không thể xác thực.';
        password.focus();
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
